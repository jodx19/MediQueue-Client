<div class="min-h-screen grid grid-cols-1 lg:grid-cols-2">

  <!-- LEFT: Brand -->
  <div class="hidden lg:flex flex-col justify-center items-center relative overflow-hidden p-16"
       style="background:#0F172A;
              background-image: linear-gradient(rgba(13,148,136,.04) 1px,transparent 1px), linear-gradient(90deg,rgba(13,148,136,.04) 1px,transparent 1px);
              background-size:60px 60px">
    <div class="absolute w-[500px] h-[500px] -top-32 -right-32 pointer-events-none"
         style="border-radius:50%;filter:blur(80px); background:radial-gradient(circle,rgba(13,148,136,.2),transparent 70%)">
    </div>
    <div class="relative z-10 text-center max-w-sm animate-fade-up">
      <div class="w-20 h-20 rounded-3xl mx-auto mb-8 flex items-center justify-center"
           style="background:linear-gradient(135deg,#0D9488,#0F766E); box-shadow:0 0 60px rgba(13,148,136,.5); animation:glowPulse 3s ease-in-out infinite">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
      </div>
      <h1 class="text-4xl font-black text-white mb-3 tracking-tight">MediQueue</h1>
      <p class="text-mq-s400 text-base leading-relaxed mb-12">Electronic Medical Records System</p>
    </div>
  </div>

  <!-- RIGHT: Form -->
  <div class="flex flex-col justify-center items-center bg-mq-800 p-8 lg:p-16">
    <div class="w-full max-w-sm animate-scale-in">
      
      <h2 class="text-3xl font-black text-white mb-2 tracking-tight">Set New Password</h2>
      <p class="text-mq-s400 text-sm mb-8 leading-relaxed">Please enter the 6-digit PIN code sent to your email along with your new password.</p>

      @if (error()) {
        <div class="flex items-start gap-3 px-4 py-3.5 rounded-xl mb-6 bg-rose-500/10 border border-rose-500/25 text-rose-400 text-sm">
          <lucide-icon name="alert-circle" [size]="16" class="flex-shrink-0 mt-0.5"/>
          <span>{{ error() }}</span>
        </div>
      }

      @if (success()) {
        <div class="flex flex-col items-center justify-center gap-3 px-4 py-8 rounded-xl mb-6 bg-mq-teal/10 border border-mq-teal/25 text-mq-teal-400 text-center animate-scale-in">
          <lucide-icon name="check-circle" [size]="40" class="mb-2"/>
          <h3 class="font-bold text-lg text-white">Password Updated!</h3>
          <p class="text-sm">Your password has been successfully reset. Redirecting to login...</p>
        </div>
      } @else {
        <form (ngSubmit)="submit()" class="space-y-5">
          <div>
            <label class="mq-label">Email Address</label>
            <input type="email" name="email" [(ngModel)]="email" class="mq-input" placeholder="doctor@mediqueue.com" required/>
          </div>
          <div>
            <label class="mq-label">6-Digit PIN Code</label>
            <input type="text" name="token" [(ngModel)]="token" class="mq-input font-mono tracking-widest text-lg" placeholder="------" required/>
          </div>
          <div>
            <label class="mq-label">New Password</label>
            <div class="relative">
              <input [type]="showPass ? 'text' : 'password'" name="newPassword" [(ngModel)]="newPassword" class="mq-input pr-16" placeholder="••••••••" required/>
              <button type="button" (click)="showPass = !showPass" class="absolute right-4 top-1/2 -translate-y-1/2 text-mq-s400 hover:text-mq-t400 text-xs font-semibold">
                {{ showPass ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>
          <div>
            <label class="mq-label">Confirm New Password</label>
            <div class="relative">
              <input [type]="showConfirm ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" class="mq-input pr-16" placeholder="••••••••" required/>
              <button type="button" (click)="showConfirm = !showConfirm" class="absolute right-4 top-1/2 -translate-y-1/2 text-mq-s400 hover:text-mq-t400 text-xs font-semibold">
                {{ showConfirm ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary w-full !py-4 !text-base gap-2" [disabled]="isLoading() || !email || !token || !newPassword || !confirmPassword">
            @if (isLoading()) {
              <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              Updating...
            } @else {
              Reset Password
              <lucide-icon name="arrow-right" [size]="16"/>
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
